name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  verify:
    name: Test and package smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.3xx
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.5"
      - name: Run the complete package acceptance path
        run: |
          chmod +x build.sh
          ./build.sh TestPackages
      - name: Upload unpublished package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: polyglot-sssom-packages
          path: artifacts/packages/*
          if-no-files-found: error
